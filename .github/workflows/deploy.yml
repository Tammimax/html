yaml
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # 如果你的預設分支是 master，請改為 master

# 給予 Actions 部署 Pages 的權限
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v4

      - name: 設定 Node.js 環境
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm' # 如果使用 pnpm / yarn，可相應調整

      - name: 安裝依賴套件
        run: npm ci

      - name: 打包專案 (編譯 TSX 為原生 JS)
        run: npm run build

      - name: 設定 Pages 產物
        uses: actions/configure-pages@v5

      - name: 上傳打包產物 (Vite 預設輸出在 dist)
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: 部署至 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
